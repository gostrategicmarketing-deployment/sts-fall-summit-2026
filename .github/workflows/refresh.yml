name: refresh

# Pull Hyros, rebuild the redacted page, deploy it to Pages. ON DEMAND ONLY.
#
# There is no schedule and no self-dispatching chain: the dashboard refreshes when
# somebody asks it to. serve.py's Refresh button dispatches this workflow after it
# rebuilds locally, so one press updates both copies. It can also be run from the
# Actions tab or with:
#   gh workflow run refresh.yml -R gostrategicmarketing-deployment/sts-fall-summit-2026
#
# The Hyros credential lives only in Actions Secrets (HYROS_API_KEY). It reaches pull.py
# as an environment variable and never touches the repo or the published page.
#
# NOTHING CARRYING PERSONAL DATA IS EVER COMMITTED OR PUBLISHED HERE.
#   - pull.py writes data/dashboard_data.json and data/raw_leads_summit2026.json into the
#     runner. Both hold buyer names and emails. Both are gitignored and neither is in the
#     Pages artifact.
#   - The page is built with --redact, which replaces buyer names with sequential labels.
#   - Only index.html and robots.txt are uploaded to Pages.
#   - Only data/daily.json is committed back, and it is dates and totals only.

on:
  workflow_dispatch:

  push:
    branches: [main]
    paths:
      - pull.py
      - hyros_api.py
      - build_dashboard.py
      - config.json
      - .github/workflows/refresh.yml

permissions:
  contents: write   # commit data/daily.json only
  pages: write
  id-token: write

# One refresh at a time, and never cancel a deploy mid-flight.
concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Pull the numbers
        env:
          HYROS_API_KEY: ${{ secrets.HYROS_API_KEY }}
          # Cost comes from Meta now, not Hyros. Without this the pull still finishes,
          # but on Hyros' relayed cost, which lags Meta by roughly 7% and would put the
          # published page out of step with both Ads Manager and the local dashboard.
          FB_TOKEN: ${{ secrets.FB_TOKEN }}
        run: |
          if [ -z "$HYROS_API_KEY" ]; then
            echo "::error::HYROS_API_KEY is not set in Actions Secrets."
            exit 1
          fi
          if [ -z "$FB_TOKEN" ]; then
            echo "::warning::FB_TOKEN is not set; spend will fall back to Hyros and lag Meta."
          fi
          python3 pull.py

      - name: Check spend came from Meta
        run: |
          python3 - <<'PY'
          import json, pathlib
          m = json.loads(pathlib.Path("data/dashboard_data.json").read_text())["meta"]
          src = m.get("cost_source")
          print(f"cost source: {src}")
          if src != "meta":
              # Not fatal: numbers that lag beat no numbers. But it must be visible,
              # because the failure is silent on the page itself otherwise.
              print("::warning::spend fell back to Hyros and will not match Ads Manager: "
                    + str(m.get("cost_source_note", "")))
          if m.get("hidden_campaign_spend", 0):
              print(f"::warning::a campaign hidden from the sheet is spending: "
                    f"${m['hidden_campaign_spend']:,.2f}")
          PY

      # Previews are the one thing Hyros cannot supply. Optional on purpose: without a
      # Meta token in Secrets the ads still rank correctly and render a neutral tile,
      # so a missing or expired token must never block publishing the numbers.
      - name: Refresh creative previews
        continue-on-error: true
        env:
          FB_TOKEN: ${{ secrets.FB_TOKEN }}
        run: |
          # continue-on-error reports this step's `conclusion` as success even when it
          # fails, so the banners below are the only honest signal. Grep for PREVIEWS.
          if [ -z "$FB_TOKEN" ]; then
            echo "PREVIEWS SKIPPED: no FB_TOKEN secret; publishing what is committed."
            exit 0
          fi
          # fetch_creatives.py resizes with Pillow, which the runner does not ship.
          # Without this the step failed at import and the failure was invisible.
          python3 -m pip install --quiet --disable-pip-version-check pillow
          if python3 fetch_creatives.py; then
            echo "PREVIEWS OK"
          else
            echo "PREVIEWS FAILED (numbers still publish; ads render a neutral tile)"
          fi

      - name: Report preview coverage
        run: |
          python3 - <<'PY'
          import json, pathlib
          d = json.loads(pathlib.Path("data/dashboard_data.json").read_text())
          a = json.loads(pathlib.Path("data/creative_assets.json").read_text())
          rank = lambda x: (-x["leads"], x["spend"] if x["leads"] else 1e9, -x["impressions"])
          shown = {x["id"] for x in sorted([y for y in d["ads"] if y["type"]=="image"], key=rank)[:10]}
          shown |= {x["id"] for x in sorted([y for y in d["ads"] if y["type"]=="video"], key=rank)[:3]}
          # Mirror build_dashboard.py's HERO_TOP: only the ten highest-earning sellers
          # are rendered, so wanting previews for all of them reports phantom gaps.
          shown |= {x["id"] for x in sorted([y for y in d["ads"] if y["purchases"]],
                                            key=lambda y: -y["revenue"])[:10]}
          missing = shown - set(a)
          print(f"PREVIEW COVERAGE {len(shown)-len(missing)}/{len(shown)} rendered ads have an image")
          if missing:
              print("::warning::previews missing for " + ", ".join(sorted(missing)[:8]))
          PY

      - name: Build the redacted page
        run: python3 build_dashboard.py --redact --out index.html

      - name: Check no personal data reached the published page
        run: |
          python3 - <<'PY'
          import re, sys, pathlib
          h = pathlib.Path("index.html").read_text()
          # Strip embedded creative data URIs first: random base64 throws false positives.
          h = re.sub(r'data:image/[a-z]+;base64,[A-Za-z0-9+/=]+', '', h)
          bad = []
          if re.search(r'[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}', h):
              bad.append("an email address")
          # Was: look for a pseudonymised buyer name. Those only ever appeared in the
          # purchase ledger, which came off the page on 2026-09-10, so the build now
          # declares its own mode and this reads that.
          if not re.search(r'name="build-mode" content="redacted"', h):
              bad.append("page is not marked as a redacted build, so --redact may not have run")
          if re.search(r'API_[0-9a-f]{16}', h):
              bad.append("something shaped like the API key")
          if bad:
              print("::error::Refusing to publish: " + "; ".join(bad))
              sys.exit(1)
          print("clean: no emails, redaction applied, no credential")
          PY

      - name: Stage the site
        run: |
          mkdir -p _site
          cp index.html _site/index.html
          [ -f robots.txt ] && cp robots.txt _site/robots.txt || true
          # The page asks this file whether it is current. Pages caches everything for
          # ten minutes and that cannot be turned off, so without it a reader keeps
          # seeing the previous build long after the deploy landed.
          python3 - <<'PY'
          import json, pathlib
          d = json.loads(pathlib.Path("data/dashboard_data.json").read_text())
          pathlib.Path("_site/version.json").write_text(
              json.dumps({"pulled_at": d["meta"]["pulled_at"]}))
          print("version.json says", d["meta"]["pulled_at"])
          PY
          # Creatives are files beside the page now, not base64 inside it. Without this
          # the published page would render every thumbnail broken.
          if [ -d creatives ]; then
            cp -R creatives _site/creatives
            echo "staged $(ls creatives | wc -l | tr -d ' ') creative files"
          else
            echo "::warning::no creatives directory; thumbnails will be missing"
          fi

      - name: Check the published page can find its images
        run: |
          python3 - <<'PY'
          import pathlib, re, sys
          h = pathlib.Path("_site/index.html").read_text()
          refs = set(re.findall(r'src="(creatives/[^"]+)"', h))
          missing = [r for r in refs if not (pathlib.Path("_site") / r).exists()]
          print(f"{len(refs)} creative references, {len(missing)} missing")
          if missing:
              print("::error::published page references images that were not staged: "
                    + ", ".join(sorted(missing)[:6]))
              sys.exit(1)
          PY

      # Pages serves this branch directly. actions/deploy-pages abandoned a half-created
      # deployment on 2026-09-10 and GitHub then refused every later one for 45 minutes
      # ("due to in progress deployment"), with cancelling, releasing the deployment
      # record and a fresh build version all failing to clear it. The link is shared
      # widely, so publishing cannot depend on a step that can wedge itself and cannot
      # be unwedged from here. Everything above this line is unchanged: the page is
      # still built, still redaction-checked, still PII-scanned, still image-checked,
      # and only then does it become the published page.
      - name: Publish the page
        run: |
          git config user.name  "gostrategicmarketing-deployment"
          git config user.email "gostrategicmarketing-deployment@users.noreply.github.com"
          cp _site/index.html index.html
          cp _site/version.json version.json
          # Tells Pages to serve the files as they are rather than running Jekyll,
          # which would otherwise decide what to publish for us.
          touch .nojekyll
          git add -f index.html version.json .nojekyll data/daily.json
          [ -d creatives ] && git add -f creatives || true
          if git diff --staged --quiet; then
            echo "nothing changed"
          else
            git commit -m "publish $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
            echo "published; Pages serves it from main within a minute or so"
          fi
